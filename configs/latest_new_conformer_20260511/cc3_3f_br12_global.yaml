name: cc3_3f_br12_global
cage_xyz: example_inputs/CC3_3F_cage.xyz
anion_template_xyz: example_inputs/br_template.xyz
fragment_mode: br
n_anions: 12
output_dir: global_runs_sjr_conformers_20260511_clean/cc3_3f_br12_global
charge: 0
spin: 1
external_field:
- 0.0
- 0.0
- 0.0
polarmace:
  model: polar-1-m
  device: cuda
  default_dtype: float64
bias:
  enabled: false
formal_q_anion: -1.0
global_search:
  seeds:
  - 1001
  - 1002
  - 1003
  - 1004
  - 1005
  n_anions: 12
  start:
    radius_min: 4.5
    radius_max: 10.5
    min_atom_distance: 1.7
    min_head_distance: 2.5
    direction_mode: fibonacci
    direction_jitter: 0.25
    orientation: random
    attempts_per_anion: 3000
    max_restarts: 100
  stages:
  - name: coarse_1500K
    temperature: 1500.0
    n_steps: 20000
    write_every: 500
    log_every: 100
    mc:
      translation_sigma: 0.3
      rotation_max_deg: 0.0
      radial_sigma: 0.25
      tangential_sigma: 0.3
      breathing_sigma: 0.02
      move_weights:
        translate: 0.45
        rotate: 0.0
        radial: 0.3
        hop: 0.2
        breathing: 0.05
      constraints:
        min_distance:
          enabled: true
          heavy_heavy: 1.2
          h_any: 0.8
        shell:
          enabled: true
          center_mode: head
          min_radius: 1.5
          max_radius: 13.0
  - name: anneal_900K
    temperature: 900.0
    n_steps: 50000
    write_every: 1000
    log_every: 100
    mc:
      translation_sigma: 0.18
      rotation_max_deg: 0.0
      radial_sigma: 0.14
      tangential_sigma: 0.18
      breathing_sigma: 0.01
      move_weights:
        translate: 0.5
        rotate: 0.0
        radial: 0.3
        hop: 0.15
        breathing: 0.05
      constraints:
        min_distance:
          enabled: true
          heavy_heavy: 1.25
          h_any: 0.85
        shell:
          enabled: true
          center_mode: head
          min_radius: 1.5
          max_radius: 13.0
  - name: refine_600K
    temperature: 600.0
    n_steps: 50000
    write_every: 1000
    log_every: 100
    mc:
      translation_sigma: 0.08
      rotation_max_deg: 0.0
      radial_sigma: 0.06
      tangential_sigma: 0.08
      breathing_sigma: 0.005
      move_weights:
        translate: 0.55
        rotate: 0.0
        radial: 0.35
        hop: 0.05
        breathing: 0.05
      constraints:
        min_distance:
          enabled: true
          heavy_heavy: 1.3
          h_any: 0.9
        shell:
          enabled: true
          center_mode: head
          min_radius: 1.5
          max_radius: 13.0
