      rotation_max_deg: 8.0
      radial_sigma: 0.12
      tangential_sigma: 0.15
      breathing_sigma: 0.015
      hop_reorient: true
      hop_random_roll: true
      move_weights:
        translate: 0.32
        rotate: 0.32
        radial: 0.2
        hop: 0.14
        breathing: 0.02
      constraints:
        min_distance:
          enabled: true
          heavy_heavy: 0.95
          h_any: 0.6
        shell:
          enabled: true
          center_mode: head
          min_radius: 1.0
          max_radius: 14.0
  - name: anneal_1200K
    temperature: 1200.0
    n_steps: 50000
    write_every: 1000
