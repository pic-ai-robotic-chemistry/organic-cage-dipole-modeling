        hop: 0.06
        breathing: 0.02
      constraints:
        min_distance:
          enabled: true
          heavy_heavy: 1.0
          h_any: 0.65
        shell:
          enabled: true
          center_mode: head
          min_radius: 1.0
          max_radius: 14.0
  - name: refine_600K
    temperature: 600.0
    n_steps: 50000
    write_every: 1000
    log_every: 100
    mc:
      translation_sigma: 0.04
      rotation_max_deg: 1.5
