      tangential_sigma: 0.04
      breathing_sigma: 0.003
      hop_reorient: true
      hop_random_roll: true
      move_weights:
        translate: 0.45
        rotate: 0.45
        radial: 0.08
        hop: 0.0
        breathing: 0.02
      constraints:
        min_distance:
          enabled: true
          heavy_heavy: 1.05
          h_any: 0.65
